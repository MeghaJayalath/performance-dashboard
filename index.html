<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Employee Performance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    background: #f5f5f5;
  }

  h1 {
    text-align: center;
    margin: 20px 0;
  }

  #gridContainer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
  }

  canvas {
    width: 100% !important;
    height: 250px !important;
    cursor: pointer;
  }

  /* Modal popup */
  #modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  #modalContent {
    width: 90vw;
    max-width: 900px;
    height: 80vh;
    background: white;
    padding: 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
  }

  #modalClose {
    align-self: flex-end;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
  }

  #modal canvas {
    flex: 1;
    width: 100% !important;
    height: 100% !important;
  }

</style>
</head>
<body>
<h1>Employee Performance Dashboard</h1>
<div id="gridContainer"></div>

<!-- Modal for expanded chart -->
<div id="modal">
  <div id="modalContent">
    <div id="modalClose">✖ Close</div>
    <canvas id="modalChart"></canvas>
  </div>
</div>

<script>
async function loadData() {
  const response = await fetch('performance.csv');
  const text = await response.text();

  const rows = text.trim().split('\n').slice(1);
  const dataMap = {}; // { employee_name: {month1: ratio, month2: ratio,...} }
  const monthsSet = new Set();

  rows.forEach(row => {
    const [id, name, month, salary, earned, ratio] = row.split(',');
    monthsSet.add(month);
    if (!dataMap[name]) dataMap[name] = {};
    dataMap[name][month] = parseFloat(ratio);
  });

  const months = Array.from(monthsSet).sort();
  const gridContainer = document.getElementById('gridContainer');

  // Create a canvas per employee
  Object.keys(dataMap).forEach(employee => {
    const canvas = document.createElement('canvas');
    gridContainer.appendChild(canvas);

    const data = months.map(m => dataMap[employee][m] || 0);

    const bgColors = data.map(r => r >= 100 ? 'green' : 'red');

    const chart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: months,
        datasets: [{
          label: employee,
          data: data,
          borderColor: 'blue',
          backgroundColor: 'rgba(54,162,235,0.2)',
          tension: 0.3,
          fill: true,
          pointBackgroundColor: bgColors
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: {
            display: true,
            text: employee
          },
          legend: { display: false },
        },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'Percentage (%)' } }
        }
      }
    });

    // Click to expand in modal
    canvas.addEventListener('click', () => openModal(employee, data, months));
  });
}

function openModal(employee, data, months) {
  const modal = document.getElementById('modal');
  modal.style.display = 'flex';

  const modalCanvas = document.getElementById('modalChart');
  // Destroy previous chart if exists
  if (modalCanvas.chart) modalCanvas.chart.destroy();

  modalCanvas.chart = new Chart(modalCanvas, {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        label: employee,
        data: data,
        borderColor: 'blue',
        backgroundColor: 'rgba(54,162,235,0.2)',
        tension: 0.3,
        fill: true,
        pointBackgroundColor: data.map(r => r >= 100 ? 'green' : 'red')
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        title: { display: true, text: employee + ' - Expanded View' },
        legend: { display: false },
        annotation: {
          annotations: {
            baseline: {
              type: 'line',
              yMin: 100,
              yMax: 100,
              borderColor: 'red',
              borderWidth: 2,
              label: { enabled: true, content: 'Break-even (100%)', position: 'end' }
            }
          }
        }
      },
      scales: {
        y: { beginAtZero: true, title: { display: true, text: 'Percentage (%)' } }
      }
    }
  });
}

// Close modal
document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modal').style.display = 'none';
});

loadData();
</script>
</body>
</html>
